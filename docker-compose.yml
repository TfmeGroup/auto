# Local/staging stack with real Postgres:  docker compose up --build
# (Not for production as-is: use a managed Postgres + secret manager. See docs/OPERATIONS.md.)
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: tfme_auto
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tfme_auto']
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - '127.0.0.1:5432:5432'

  migrate:
    build: { context: ., target: migrate }
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV: production
      MIGRATE_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/tfme_auto
      DATABASE_URL: postgresql://tfme_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@db:5432/tfme_auto
      APP_URL: ${APP_URL:-http://localhost:3000}
      EMAIL_DRIVER: console
    restart: 'no'

  web:
    build: { context: ., target: web }
    depends_on:
      migrate: { condition: service_completed_successfully }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tfme_app:${APP_DB_PASSWORD}@db:5432/tfme_auto
      JOBS_INLINE_WORKER: 'false'
    ports:
      - '3000:3000'
    volumes:
      - files:/app/storage-data

  worker:
    build: { context: ., target: worker }
    depends_on:
      migrate: { condition: service_completed_successfully }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tfme_app:${APP_DB_PASSWORD}@db:5432/tfme_auto
    volumes:
      - files:/app/storage-data

volumes:
  pgdata:
  files:
